<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Barbershop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#14223A;--on:#fff;--mute:#667489;--line:#DDE3EA;--red:#C62F2F;--blue:#1F4E9C;--ok:#2E7D4F;--soft:#E7EEF9;color-scheme:light}
[data-theme=dark]{--bg:#16191F;--card:#20242C;--ink:#EEF1F5;--on:#14223A;--mute:#9AA5B5;--line:#2F3540;--red:#F07C75;--blue:#7FA8EE;--ok:#5CC48A;--soft:#2A2F38;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit;color:inherit}button{border:0;background:none;padding:0;cursor:pointer;text-align:left}
#app{max-width:520px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;height:5px;background:var(--line);margin:0 -16px;z-index:5}.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 4px}
.hd b{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;text-align:center}.ib:active{background:var(--soft)}
h1{font-size:28px;margin:18px 0 4px}.sub,.mute{color:var(--mute)}.sub{margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;width:100%;display:block}
button.card:active{background:var(--soft)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--soft)}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.card.on{border-color:var(--blue);background:var(--soft)}
.strip{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 14px;padding:2px 16px;scrollbar-width:none}
.chip{flex:0 0 auto;width:56px;padding:8px 0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px}
.chip small{display:block;color:var(--mute);font-size:12px}.chip b{font-size:20px}
.on.chip,.on.slot,.seg .on{background:var(--ink);border-color:var(--ink);color:var(--on)}.on.chip small{color:var(--on);opacity:.7}
.chip:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:12px 0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px;font-weight:600}
.act{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));padding:20px 16px 10px;background:linear-gradient(transparent,var(--bg) 40%);z-index:6;pointer-events:none}
.act.nn{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.act>div{max-width:520px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.pri{flex:1;height:52px;border-radius:12px;background:var(--ink);color:var(--on);font-weight:600;font-size:17px;text-align:center}.pri:disabled{opacity:.35}
.ghost,.sm{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.sm.ok{background:var(--soft);color:var(--ok);border-color:transparent}.sm.no{color:var(--red);border-color:transparent;background:var(--soft)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:7;padding-bottom:env(safe-area-inset-bottom)}
.nav>div{max-width:520px;margin:0 auto;display:flex}.nav button{flex:1;height:58px;text-align:center;color:var(--mute);font-size:13px;font-weight:600}.nav .on{color:var(--blue)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);color:var(--mute)}
.tag.pending{color:#B7791F}.tag.booked{color:var(--blue)}.tag.done{color:var(--ok)}.tag.no_show,.tag.cancelled{color:var(--red)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:12px 0}.seg button{flex:1;text-align:center;padding:9px 0;border-radius:10px;font-weight:600;color:var(--mute)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.t{font-size:24px;font-weight:700}
input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card)}
a{color:var(--blue);font-weight:600;text-decoration:none}
.center{text-align:center;padding:90px 0}.empty{text-align:center;color:var(--mute);padding:30px 0}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:10px 16px;border-radius:12px;z-index:20;max-width:88%;display:none}#toast.er{background:var(--red);color:#fff}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const API_BASE = "https://YOUR-SERVICE.onrender.com"; // Render manzili
const TZ = "Asia/Tashkent", tg = window.Telegram && Telegram.WebApp;
const T = {
uz:{book:"Yozilish",mine:"Yozuvlarim",sched:"Jadval",branch:"Filialni tanlang",barber:"Ustani tanlang",svc:"Xizmatlar",when:"Sana va vaqt",phone:"Telefon raqamingiz",next:"Davom etish",confirm:"Yozilish",from:"dan",min:"daqiqa",sum:"so'm",
 none:"Bo'sh vaqt yo'q",active:"Faol",hist:"Tarix",cancel:"Bekor qilish",ok:"Tasdiqlash",rej:"Rad etish",done:"Keldi",nos:"Kelmadi",empty:"Hech narsa yo'q",sure:"Bekor qilamizmi?",
 saved:"Yozildingiz! Usta tasdig'ini kuting ✅",retry:"Qayta urinish",loading:"Yuklanmoqda…",map:"Xaritada",pick:"Xizmat tanlang",
 st:{pending:"Kutilmoqda",booked:"Tasdiqlangan",done:"Bajarildi",no_show:"Kelmadi",cancelled:"Bekor"},
 er:{slot_unavailable:"Bu vaqt band bo'ldi, boshqasini tanlang",slot_taken:"Bu vaqt band bo'ldi",too_many:"Faol yozuvlar soni limitga yetdi",too_late:"Vaqt o'tib bo'ldi",cannot_cancel:"Bekor qilib bo'lmaydi",server_error:"Server xatosi",auth_expired:"Mini appni qayta oching"}},
ru:{book:"Записаться",mine:"Мои записи",sched:"Расписание",branch:"Выберите филиал",barber:"Выберите мастера",svc:"Услуги",when:"Дата и время",phone:"Ваш телефон",next:"Далее",confirm:"Записаться",from:"от",min:"мин",sum:"сум",
 none:"Нет свободного времени",active:"Активные",hist:"История",cancel:"Отменить",ok:"Подтвердить",rej:"Отклонить",done:"Пришёл",nos:"Не пришёл",empty:"Пока пусто",sure:"Отменить запись?",
 saved:"Вы записаны! Ждите подтверждения мастера ✅",retry:"Повторить",loading:"Загрузка…",map:"На карте",pick:"Выберите услугу",
 st:{pending:"Ожидает",booked:"Подтверждена",done:"Выполнена",no_show:"Не пришёл",cancelled:"Отменена"},
 er:{slot_unavailable:"Это время уже занято, выберите другое",slot_taken:"Это время уже занято",too_many:"Достигнут лимит активных записей",too_late:"Время уже прошло",cannot_cancel:"Отменить нельзя",server_error:"Ошибка сервера",auth_expired:"Откройте мини-приложение заново"}}
};
const S = {lang: localStorage.lang || "uz", view: "book", step: 1, scope: "active", sd: ymd(new Date())};
const t = k => (T[S.lang][k] ?? T.uz[k] ?? k);
const $a = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm = (o, k = "name") => (S.lang === "ru" && o[k + "_ru"]) || o[k] || "";
const money = n => Number(n).toLocaleString("ru-RU") + " " + t("sum");
const hhmm = iso => new Date(iso).toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit", timeZone: TZ});
const dmy = iso => new Date(iso).toLocaleDateString("ru-RU", {day: "2-digit", month: "2-digit", timeZone: TZ});
const isStaff = () => ["owner", "admin", "barber"].includes(S.me.role);
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function toast(m, er) { const e = document.getElementById("toast"); e.textContent = m; e.className = er ? "er" : ""; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 3000); }
const errText = e => (T[S.lang].er[e.message] || e.message || "Xato");
function ask(msg) { return new Promise(r => tg && tg.initData && tg.showConfirm ? tg.showConfirm(msg, r) : r(confirm(msg))); }

async function api(path, o = {}) {
  const r = await fetch(API_BASE + path, {method: o.method || "GET", headers: {"Content-Type": "application/json", "X-Init-Data": (tg && tg.initData) || ""}, body: o.body ? JSON.stringify(o.body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "server_error");
  return j;
}
const q = o => new URLSearchParams(o).toString();

// ---------- views
const header = () => `<div class="hd"><b>${esc(nm(S.shop))}</b><div class="row"><button class="ib" data-a="theme">◐</button><button class="ib" data-a="lang">${S.lang.toUpperCase()}</button></div></div>`;
const nav = () => isStaff() && S.me.role !== "barber-x" ? `<div class="nav"><div><button class="${S.view === "sched" ? "on" : ""}" data-a="view" data-v="sched">📅 ${t("sched")}</button><button class="${S.view === "book" ? "on" : ""}" data-a="view" data-v="book">✂️ ${t("book")}</button><button class="${S.view === "mine" ? "on" : ""}" data-a="view" data-v="mine">🗂 ${t("mine")}</button></div></div>`
  : `<div class="nav"><div><button class="${S.view === "book" ? "on" : ""}" data-a="view" data-v="book">✂️ ${t("book")}</button><button class="${S.view === "mine" ? "on" : ""}" data-a="view" data-v="mine">🗂 ${t("mine")}</button></div></div>`;
const act = (label, a, dis, back) => `<div class="act ${back === 0 ? "nn" : ""}"><div>${back ? `<button class="ghost" data-a="back">←</button>` : ""}<button class="pri" id="b-ok" data-a="${a}" ${dis ? "disabled" : ""}>${label}</button></div></div>`;
const av = o => o.photo_url ? `<img class="av" src="${API_BASE + o.photo_url}">` : `<div class="av">${esc(nm(o)[0] || "?")}</div>`;

function render() {
  let h = header();
  if (S.view === "book") h += bookView();
  else if (S.view === "mine") h += mineView();
  else h += schedView();
  $a.innerHTML = h + nav();
}

function bookView() {
  const steps = 5, bar = `<div class="bar"><i style="width:${S.step / steps * 100}%"></i></div>`;
  if (S.step === 1) {
    if (S.branches.length === 1 && !S.branch) { S.branch = S.branches[0]; S.step = 2; return bookView(); }
    return bar + `<h1>${t("branch")}</h1>` + S.branches.map(b => `<button class="card" data-a="branch" data-id="${b.id}">${b.photo_url ? `<img src="${API_BASE + b.photo_url}">` : ""}<b>${esc(nm(b))}</b><div class="mute">${esc(nm(b, "address"))}</div></button>`).join("");
  }
  if (S.step === 2) {
    const bs = S.barbers.filter(b => b.branch_id === S.branch.id);
    return bar + `<h1>${t("barber")}</h1>` + bs.map(b => `<button class="card row" data-a="barber" data-id="${b.id}"><div class="row" style="justify-content:flex-start">${av(b)}<b>${esc(nm(b))}</b></div>${b.min_price ? `<span class="mute">${t("from")} ${money(b.min_price)}</span>` : ""}</button>`).join("")
      + (S.branches.length > 1 ? act("←", "back", false, 0).replace('class="pri"', 'class="pri" style="display:none"').replace('<button class="pri"', '<button class="ghost" data-a="back">←</button><button class="pri"') : "");
  }
  if (S.step === 3) {
    const ss = S.services.filter(x => x.barber_id === S.bar.id), sel = S.sel || [];
    return bar + `<h1>${t("svc")}</h1>` + ss.map(x => `<button class="card row ${sel.includes(x.id) ? "on" : ""}" data-a="svc" data-id="${x.id}"><div><b>${esc(nm(x))}</b><div class="mute">${x.duration_min} ${t("min")}</div></div><b>${money(x.price)}</b></button>`).join("")
      + act(t("next"), "to4", !sel.length, 1);
  }
  if (S.step === 4) {
    const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
    const off = S.off || {weekdays: [], days: []};
    const strip = days.map(d => { const k = ymd(d), o = off.weekdays.includes((d.getDay() + 6) % 7) || off.days.includes(k);
      return `<button class="chip ${S.date === k ? "on" : ""}" ${o ? "disabled" : ""} data-a="date" data-d="${k}"><small>${d.toLocaleDateString(S.lang === "ru" ? "ru-RU" : "uz-UZ", {weekday: "short"})}</small><b>${d.getDate()}</b></button>`; }).join("");
    const sl = S.slots === null ? `<div class="empty">${t("loading")}</div>` : !S.slots.length ? `<div class="empty">${t("none")}</div>` : `<div class="slots">${S.slots.map(s => `<button class="slot ${S.time === s ? "on" : ""}" data-a="time" data-s="${s}">${hhmm(s)}</button>`).join("")}</div>`;
    return bar + `<h1>${t("when")}</h1><div class="strip">${strip}</div>${sl}` + act(t("next"), "to5", !S.time, 1);
  }
  const ss = S.services.filter(x => S.sel.includes(x.id)), tot = ss.reduce((a, x) => a + x.price, 0), mins = ss.reduce((a, x) => a + x.duration_min, 0);
  return bar + `<h1>${t("confirm")}</h1><div class="card"><b>${esc(nm(S.bar))}</b> · ${esc(nm(S.branch))}<div class="t">${dmy(S.time)} ${hhmm(S.time)}</div>${ss.map(x => `<div class="row"><span>${esc(nm(x))}</span><span class="mute">${money(x.price)}</span></div>`).join("")}<hr style="border:0;border-top:1px solid var(--line)"><div class="row"><b>${money(tot)}</b><span class="mute">${mins} ${t("min")}</span></div></div>`
    + `<h2 style="font-size:18px">${t("phone")}</h2><input id="f-ph" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" value="${esc(S.phone || "")}">` + act(t("confirm"), "send", !phoneOk(), 1);
}
const phoneOk = () => (S.phone || "").replace(/\D/g, "").length >= 9;

function bkCard(b, staff) {
  const names = (S.lang === "ru" && b.svc_names_ru) || b.svc_names, st = b.status, canAct = ["pending", "booked"].includes(st);
  let btns = "";
  if (staff) {
    if (st === "pending") btns += `<button class="sm ok" data-a="set" data-id="${b.id}" data-s="booked">${t("ok")}</button><button class="sm no" data-a="set" data-id="${b.id}" data-s="cancelled">${t("rej")}</button>`;
    if (st === "booked") btns += `<button class="sm ok" data-a="set" data-id="${b.id}" data-s="done">${t("done")}</button><button class="sm" data-a="set" data-id="${b.id}" data-s="no_show">${t("nos")}</button><button class="sm no" data-a="set" data-id="${b.id}" data-s="cancelled">${t("cancel")}</button>`;
  } else if (canAct) btns = `<button class="sm no" data-a="cancel" data-id="${b.id}">${t("cancel")}</button>`;
  const br = b.branches || {}, map = !staff && br.lat != null ? `<div><a href="https://www.google.com/maps/search/?api=1&query=${br.lat},${br.lng}" target="_blank">📍 ${t("map")}</a></div>` : "";
  return `<div class="card"><div class="row"><span class="t">${staff ? "" : dmy(b.start_at) + " "}${hhmm(b.start_at)}</span><span class="tag ${st}">${t("st")[st] || st}</span></div>
  <div><b>${esc(names)}</b></div><div class="mute">${staff ? esc((b.users || {}).name || "") + (b.users && b.users.phone ? ` · <a href="tel:${esc(b.users.phone)}">${esc(b.users.phone)}</a>` : "") : "✂️ " + esc(nm(b.barbers || {})) + " · " + esc(nm(br))}</div>${map}<div class="mute">${money(b.total_price || 0)}</div>${btns ? `<div class="btns">${btns}</div>` : ""}</div>`;
}

function mineView() {
  const seg = `<div class="seg"><button class="${S.scope === "active" ? "on" : ""}" data-a="scope" data-s="active">${t("active")}</button><button class="${S.scope === "history" ? "on" : ""}" data-a="scope" data-s="history">${t("hist")}</button></div>`;
  const l = S.mineList;
  return `<h1>${t("mine")}</h1>${seg}` + (l === undefined ? `<div class="empty">${t("loading")}</div>` : l.length ? l.map(b => bkCard(b, false)).join("") : `<div class="empty">${t("empty")}</div>`);
}

function schedView() {
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i - 1); return d; });
  const strip = `<div class="strip">${days.map(d => { const k = ymd(d); return `<button class="chip ${S.sd === k ? "on" : ""}" data-a="sday" data-d="${k}"><small>${d.toLocaleDateString("ru-RU", {weekday: "short"})}</small><b>${d.getDate()}</b></button>`; }).join("")}</div>`;
  const l = S.sched;
  const body = l === undefined ? `<div class="empty">${t("loading")}</div>` : l.map(x => `<h2 style="font-size:18px;margin:16px 0 8px">✂️ ${esc(nm(x.barber))}</h2>` + (x.bookings.length ? x.bookings.map(b => bkCard(b, true)).join("") : `<div class="empty" style="padding:8px">${t("empty")}</div>`)).join("") || `<div class="empty">${t("empty")}</div>`;
  return `<h1>${t("sched")}</h1>${strip}${body}`;
}

// ---------- data loaders
async function loadMine() { S.mineList = undefined; render(); try { S.mineList = await api("/api/my-bookings?" + q({scope: S.scope})); } catch (e) { toast(errText(e), true); S.mineList = []; } render(); }
async function loadSched() { S.sched = undefined; render(); try { S.sched = await api("/api/admin/schedule?" + q({date_: S.sd})); } catch (e) { toast(errText(e), true); S.sched = []; } render(); }
async function loadSlots() {
  S.slots = null; S.time = null; render();
  try { const r = await api("/api/slots?" + q({date_: S.date, barber_id: S.bar.id, service_ids: S.sel.join(",")})); if (r) S.slots = r.slots; } catch (e) { toast(errText(e), true); S.slots = []; }
  render();
}

// ---------- actions
const H = {
  theme: () => { S.dark = !S.dark; applyTheme(); },
  lang: async () => { S.lang = S.lang === "uz" ? "ru" : "uz"; localStorage.lang = S.lang; render(); api("/api/me/lang", {method: "POST", body: {lang: S.lang}}).catch(() => {}); },
  view: d => { S.view = d.v; if (d.v === "mine") loadMine(); else if (d.v === "sched") loadSched(); else render(); },
  branch: d => { S.branch = S.branches.find(b => b.id == d.id); S.step = 2; render(); },
  barber: d => { S.bar = S.barbers.find(b => b.id == d.id); S.sel = []; S.step = 3; render(); },
  svc: d => { const id = Number(d.id), i = S.sel.indexOf(id); i < 0 ? S.sel.push(id) : S.sel.splice(i, 1); render(); },
  to4: async () => { S.step = 4; S.date = null; S.time = null; S.slots = []; S.off = null; render(); try { S.off = await api("/api/barber-off?" + q({barber_id: S.bar.id})); } catch (e) {} render(); },
  date: d => { S.date = d.d; loadSlots(); },
  time: d => { S.time = d.s; render(); },
  to5: () => { S.phone = S.phone || S.me.phone || ""; S.step = 5; render(); },
  back: () => { S.step = Math.max(1, S.step - 1); if (S.step === 1 && S.branches.length === 1) S.step = 2; if (S.step === 2 && S.branches.length === 1) { S.step = 2; } render(); },
  send: async () => {
    const b = document.getElementById("b-ok"); b.disabled = true;
    try {
      await api("/api/bookings", {method: "POST", body: {barber_id: S.bar.id, service_ids: S.sel, start_at: S.time, phone: S.phone.trim()}});
      S.me.phone = S.phone.trim(); toast(t("saved")); if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      S.step = 1; S.branch = S.branches.length === 1 ? S.branches[0] : null; S.sel = []; S.time = null; S.view = "mine"; S.scope = "active"; loadMine();
    } catch (e) { toast(errText(e), true); b.disabled = false; if (/slot/.test(e.message)) { S.step = 4; loadSlots(); } }
  },
  scope: d => { S.scope = d.s; loadMine(); },
  cancel: async d => { if (!(await ask(t("sure")))) return; try { await api("/api/bookings/" + d.id + "/cancel", {method: "POST"}); loadMine(); } catch (e) { toast(errText(e), true); } },
  sday: d => { S.sd = d.d; loadSched(); },
  set: async d => { try { await api("/api/admin/bookings/" + d.id + "/status", {method: "POST", body: {status: d.s}}); loadSched(); } catch (e) { toast(errText(e), true); } },
  retry: () => boot(),
};
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (el && H[el.dataset.a]) H[el.dataset.a](el.dataset, el); });
document.addEventListener("input", e => { if (e.target.id === "f-ph") { S.phone = e.target.value; document.getElementById("b-ok").disabled = !phoneOk(); } });

function applyTheme() {
  const dark = S.dark ?? (tg && tg.colorScheme === "dark");
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
function screen(title, text, retry) { $a.innerHTML = `<div class="center"><h1>${esc(title)}</h1><p class="sub">${esc(text)}</p>${retry ? `<button class="ghost" data-a="retry">${t("retry")}</button>` : ""}</div>`; }

async function boot() {
  if (tg) { tg.ready(); tg.expand(); }
  applyTheme();
  screen(t("loading"), "", false);
  const slow = setTimeout(() => screen(t("loading"), "Server uyg'onmoqda… / Сервер просыпается…", false), 5000);
  try {
    const b = await api("/api/bootstrap");
    Object.assign(S, {me: b.me, shop: b.shop, branches: b.branches, barbers: b.barbers || [], services: b.services});
    S.lang = b.me.lang || S.lang; localStorage.lang = S.lang;
  } catch (e) { clearTimeout(slow); screen("Ochilmadi", errText(e), true); return; }
  clearTimeout(slow);
  document.title = nm(S.shop);
  S.branch = S.branches.length === 1 ? S.branches[0] : null;
  S.step = S.branch ? 2 : 1;
  if (isStaff()) { S.view = "sched"; loadSched(); } else render();
}
boot();
</script>
</body>
</html>
